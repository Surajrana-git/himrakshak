<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14231F" />
    <title>Offline · Himrakshak</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #14231f;
        color: #f3f1ea;
        font-family: system-ui, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 28px; margin: 20px 0 8px; }
      p { line-height: 1.5; margin: 0 0 12px; }
      .muted { color: #b9c2bd; font-size: 14px; }
      button {
        margin-top: 12px;
        min-height: 56px;
        width: 100%;
        border: 0;
        border-radius: 999px;
        background: #f08a3e;
        color: #14231f;
        font-size: 18px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>No network</h1>
      <p>There is no internet right now, and this page was not saved before.</p>
      <p class="muted">Try again when you have signal.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
